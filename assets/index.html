<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>{TITLE}</title>
<style>
:root {
  --bg: #0b0e14;
  --panel: #141926;
  --panel-edge: #232b3e;
  --text: #e8ecf4;
  --muted: #8b93a7;
  --accent: #5aa2ff;
  --accent-press: #3d7fd6;
  --ok: #4fc98a;
  --err: #ff6b6b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  padding-top: max(24px, env(safe-area-inset-top));
}
h1 {
  font-size: 1.35rem;
  letter-spacing: 0.02em;
  margin: 0 0 4px;
}
.sub { color: var(--muted); margin: 0 0 20px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 12px;
  padding: 18px;
}
.step { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.step .mark {
  width: 22px; height: 22px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 2px solid var(--muted);
  color: var(--bg);
  font-weight: 700; font-size: 13px;
}
.step.done .mark { background: var(--ok); border-color: var(--ok); }
.step.error .mark { background: var(--err); border-color: var(--err); }
.step.active .mark { border-color: var(--accent); color: var(--accent); }
.step .label { color: var(--muted); }
.step.done .label, .step.active .label { color: var(--text); }
#drop {
  margin: 18px 0 10px;
  border: 2px dashed var(--panel-edge);
  border-radius: 12px;
  padding: 28px 18px;
  text-align: center;
  color: var(--muted);
  transition: border-color .15s, background .15s;
}
#drop.drag {
  border-color: var(--accent);
  background: rgba(90, 162, 255, 0.06);
  color: var(--text);
}
button {
  display: inline-block;
  width: 100%;
  margin-top: 12px;
  padding: 13px 16px;
  font: inherit;
  font-weight: 600;
  color: var(--text);
  background: var(--accent);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
button:active { background: var(--accent-press); }
button[disabled] { opacity: 0.55; cursor: default; }
button.ghost {
  background: transparent;
  border: 1px solid var(--panel-edge);
  color: var(--muted);
  font-weight: 500;
}
#status { min-height: 24px; margin: 14px 2px 0; color: var(--muted); }
#status.ok { color: var(--ok); }
#status.err { color: var(--err); }
#bar {
  height: 8px;
  border-radius: 4px;
  background: var(--panel-edge);
  overflow: hidden;
  margin-top: 10px;
  display: none;
}
#bar > div {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width .2s;
}
footer { color: var(--muted); font-size: 0.85rem; margin-top: 26px; }
</style>
</head>
<body>
<main>
  <h1>{TITLE}</h1>
  <p class="sub">{MESSAGE}</p>
  <section class="panel">
    <ol id="files" style="list-style:none; margin:0; padding:0"></ol>
    <div id="drop">
      <label for="picker" style="cursor:pointer">Choose files</label>
      or drop them here
      <br><small id="pick-hint">{HINT}</small>
    </div>
    <input id="picker" type="file" multiple style="display:none">
    <div id="bar"><div></div></div>
    <button id="start" disabled>Start</button>
    <button id="again" class="ghost" style="display:none">Choose different files</button>
    <p id="status" role="status"></p>
  </section>
  <footer>{FOOTER}</footer>
</main>
<script src="setup.js"></script>
</body>
</html>
